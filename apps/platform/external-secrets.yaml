apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.10.0
      helm:
        values: |
          extraEnv:
            - name: AWS_ENDPOINT_URL_SECRETSMANAGER
              value: http://host.docker.internal:4566
            - name: AWS_REGION
              value: us-west-2
    - repoURL: https://github.com/codewithjams-url-shortener/url-shortener-gitops.git
      targetRevision: main
      # Deliberately outside apps/ — see cluster-secret-stores/local/local.yaml for why.
      # Only local/ is synced — cluster-secret-stores/aws/ stays static reference content,
      # same reasoning as apps/services-applicationset.yaml omitting "environment: aws": this
      # is the one real cluster this project has, so an aws-secrets-manager ClusterSecretStore
      # here isn't inert, it's live and permanently InvalidProviderConfig (no real AWS/IRSA),
      # which drags external-secrets' overall Health to Degraded. See issue #12.
      path: cluster-secret-stores/local
      directory: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # ESO's ClusterSecretStore/SecretStore CRDs are large enough that ArgoCD's default
      # client-side apply annotation (kubectl.kubernetes.io/last-applied-configuration) exceeds
      # Kubernetes' 262144-byte annotation limit. Same fix as ArgoCD's own CRD install hit in
      # url-shortener-infra#11 — except ServerSideApply=true alone wasn't enough here (confirmed
      # live in the cluster, same error persisted with it set): ArgoCD doesn't consistently apply
      # SSA semantics to CRDs specifically in this version. Replace=true sidesteps the issue
      # entirely — kubectl-replace/PUT semantics involve no diff-annotation at all. See issue #12.
      - ServerSideApply=true
      - Replace=true
