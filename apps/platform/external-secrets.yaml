apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.10.0
      helm:
        values: |
          extraEnv:
            - name: AWS_ENDPOINT_URL_SECRETSMANAGER
              value: http://host.docker.internal:4566
            - name: AWS_REGION
              value: us-west-2
    - repoURL: https://github.com/codewithjams-url-shortener/url-shortener-gitops.git
      targetRevision: main
      # Deliberately outside apps/ — see cluster-secret-stores/local.yaml for why.
      path: cluster-secret-stores
      directory: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # ESO's ClusterSecretStore/SecretStore CRDs are large enough that ArgoCD's default
      # client-side apply annotation (kubectl.kubernetes.io/last-applied-configuration) exceeds
      # Kubernetes' 262144-byte annotation limit. Same fix as ArgoCD's own CRD install hit in
      # url-shortener-infra#11.
      - ServerSideApply=true
