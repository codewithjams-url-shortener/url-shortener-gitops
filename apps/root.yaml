apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/codewithjams-url-shortener/url-shortener-gitops.git
    targetRevision: main
    path: apps
    directory:
      recurse: true
      exclude: "root.yaml"
      # NOTE: cluster-secret-stores/ lives at the repo root, outside this apps/ tree, specifically
      # so this recursive sync never sees it — see cluster-secret-stores/local.yaml for why.
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
