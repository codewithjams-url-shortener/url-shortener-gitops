image:
  repository: ""
  tag: "latest"
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

serviceAccount:
  create: true
  name: ""

probes:
  liveness:
    path: /actuator/health/liveness
  readiness:
    path: /actuator/health/readiness

serviceMonitor:
  enabled: true
  releaseLabel: prometheus-stack
  path: /actuator/prometheus
  interval: 15s

config:
  # Overrides each service's own local-dev default (localhost:4318, for bootRun + a manual
  # Jaeger port-forward) with Jaeger's real in-cluster address. See url-shortener-gitops#42.
  MANAGEMENT_OTLP_TRACING_ENDPOINT: http://jaeger.monitoring.svc.cluster.local:4318/v1/traces

externalSecret:
  enabled: false
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 1h
  data: []
    # - secretKey: DB_PASSWORD
    #   remoteRef:
    #     key: url-service/db-password

appConfigAgent:
  enabled: false
  image:
    repository: public.ecr.aws/aws-appconfig/aws-appconfig-agent
    tag: "2.x"
  port: 2772
  awsRegion: us-west-2
  awsEndpointUrl: ""
