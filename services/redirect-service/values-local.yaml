image:
  repository: localhost:5100/redirect-service
  tag: f0883d5

# Chart default is 8080; moved off it to avoid colliding with unrelated local tooling when
# running services directly on the host outside Kubernetes (e.g. a leftover
# kubectl port-forward). See url-shortener-gitops#39 and url-service#1.
service:
  port: 5234

config:
  SPRING_PROFILES_ACTIVE: local
  # Floci runs on the host, not in the pod, so the application.yaml default of localhost:4566 points at the pod itself.
  # host.docker.internal:4566 is the address the External Secrets Operator already reaches it on. See url-service's
  # values-local.yaml for why the names have no underscore between the words of a property.
  AWS_DYNAMODB_ENDPOINTOVERRIDE: http://host.docker.internal:4566
  AWS_SNS_ENDPOINTOVERRIDE: http://host.docker.internal:4566
  # Where the 5xx and request counts behind the AppConfig rollback alarm are published (ADR-0011).
  AWS_CLOUDWATCH_ENDPOINTOVERRIDE: http://host.docker.internal:4566
