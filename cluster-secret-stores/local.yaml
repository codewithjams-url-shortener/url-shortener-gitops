# IMPORTANT: this directory MUST stay outside apps/, at the repo root. It's applied exclusively
# via apps/platform/external-secrets.yaml's second ($values-style directory) source, alongside
# the external-secrets Helm chart. If moved back under apps/, root.yaml's own recursive directory
# sync would pick these ClusterSecretStore manifests up a second time and try to apply them
# directly — before the external-secrets Application has installed the ESO CRDs that define this
# resource kind, causing a sync failure ("the server could not find the requested resource" for
# external-secrets.io/v1beta1). Root cause and full history: issue #12.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: local-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-west-2
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: floci-aws-dummy-creds
            namespace: external-secrets
            key: access-key-id
          secretAccessKeySecretRef:
            name: floci-aws-dummy-creds
            namespace: external-secrets
            key: secret-access-key
